[project]
name = "wcd-api"
version = "2.0.0a0"
description = "Wikipedia Citations Database — the /api/v2 service (FastAPI) over Postgres and the Parquet tier"
requires-python = ">=3.10"
dependencies = [
    "wcd-schema",
    "wcd-pipeline",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "duckdb>=1.0.0",
    "httpx>=0.27",
    "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
wcd-api = "wcd_api.main:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
