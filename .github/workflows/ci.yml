name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wcd
          POSTGRES_PASSWORD: wcd
          POSTGRES_DB: wcd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wcd" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/revisionchest
      - run: cargo build --release --workspace
        working-directory: rust/revisionchest
      - run: cargo test --workspace
        working-directory: rust/revisionchest
        env:
          REVISIONCHEST_TEST_DATABASE_URL: postgresql://wcd:wcd@127.0.0.1:5432/wcd_test
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust/revisionchest
      - run: cargo fmt --all -- --check
        working-directory: rust/revisionchest
      - uses: actions/upload-artifact@v4
        with:
          name: revisionchest-linux-x86_64
          path: rust/revisionchest/target/release/RevisionChest
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wcd
          POSTGRES_PASSWORD: wcd
          POSTGRES_DB: wcd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wcd" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: revisionchest-linux-x86_64
          path: bin
      - run: chmod +x bin/RevisionChest
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run pytest -q
        env:
          WCD_TEST_DATABASE_URL: postgresql://wcd:wcd@127.0.0.1:5432/wcd_test
          REVISIONCHEST_BIN: ${{ github.workspace }}/bin/RevisionChest
