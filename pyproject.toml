# Wikipedia Citations Database — monorepo workspace root.
#
# This file is the uv workspace definition and shared tool config. It is not
# itself an installable package; the packages live under packages/ and apps/.
#
#   uv sync                      install every workspace member (editable) + dev deps
#   uv run wcd --help            the pipeline CLI
#   uv run pytest                tests across the workspace
[project]
name = "wcd-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "wcd-pipeline",
    "wcd-schema",
    "wiki-references-extractor",
    "wiki-citation-normalizer",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
wcd-pipeline = { workspace = true }
wcd-schema = { workspace = true }
wiki-references-extractor = { workspace = true }
wiki-citation-normalizer = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/normalizer/tests",
    "packages/extractor/tests",
    "packages/schema/tests",
    "packages/pipeline/tests",
]
