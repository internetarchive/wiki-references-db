[project]
name = "wcd-pipeline"
version = "3.0.0a0"
description = "Wikipedia Citations Database build pipeline (extract, dedup, load, ...)"
requires-python = ">=3.10"
dependencies = [
    "wiki-references-extractor",
    "wiki-citation-normalizer",
    "wcd-schema",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "zstandard>=0.22.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "python-dotenv",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
wcd = "wcd_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
